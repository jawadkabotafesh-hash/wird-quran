<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردي - صدقة جارية</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2800/2800115.png">
    <style>
        :root { --primary: #2ecc71; --accent: #f1c40f; --bg: #0f2027; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f2027; color: white; margin: 0; padding: 10px; text-align: center; }
        
        /* تصميم الصدقة الجارية */
        .charity-header { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 15px; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; line-height: 1.5; }
        
        .ramadan-header { background: linear-gradient(45deg, #1e3c72, #2a5298); color: #fff; padding: 15px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        h1 { font-size: 1.2rem; color: var(--primary); margin: 5px 0; }
        .juz-badge { color: var(--accent); font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; display: block; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-sebha { background: var(--accent); color: #000; }
        .btn-share { background: #25D366; color: white; }

        .quran-view { width: 100%; height: 75vh; border-radius: 15px; border: 1px solid var(--primary); background: white; margin-top: 5px; }
        
        /* منطقة السبحة */
        #sebha-display { display: none; margin-top: 10px; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid var(--accent); }
        #count-num { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; display: block; font-family: monospace; }
        .btn-count { width: 100%; background: var(--primary); color: white; height: 60px; font-size: 1.5rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); }
    </style>
</head>
<body>

<div class="charity-header">
    🤍 صدقة جارية عن روح المرحومة <br>
    (شمسية أم شكري) <br>
    <span style="font-size: 0.75rem; font-weight: normal; color: #eee;">نسألكم الفاتحة والدعاء لها بالرحمة والمغفرة</span>
</div>

<div class="ramadan-header">
    🌙 مبارك عليكم الشهر <br>
    <span style="font-size: 0.8rem; font-weight: normal;">تقبل الله منا ومنكم صالح الأعمال</span>
</div>

<div class="glass-card">
    <h1>✨ ورد اليوم الأول</h1>
    <span class="juz-badge">الجزء رقم 1</span>
    
    <div class="btn-grid">
        <button class="btn-sebha" onclick="toggleSebha()">📿 السبحة الإلكترونية</button>
        <button class="btn-share" onclick="shareApp()">📢 انشر الأجر</button>
    </div>

    <div id="sebha-display">
        <span id="count-num">0</span>
        <button class="btn-count" onclick="addCount()">سبّح</button>
        <button onclick="resetCount()" style="background:transparent; color:#ff4757; margin-top:15px; font-size:0.8rem; text-decoration: underline;">تصفير العداد</button>
    </div>
</div>

<iframe id="quran-frame" class="quran-view" src="https://quran.com/juz/1?view=reading"></iframe>

<script>
    function toggleSebha() {
        const d = document.getElementById("sebha-display");
        d.style.display = (d.style.display === "block") ? "none" : "block";
        if(d.style.display === "block") {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function addCount() {
        let sCount = parseInt(document.getElementById("count-num").innerText);
        sCount++;
        document.getElementById("count-num").innerText = sCount;
        // اهتزاز بسيط لو مدعوم في الجهاز لزيادة التفاعل
        if (navigator.vibrate) navigator.vibrate(50);
    }

    function resetCount() {
        if(confirm("هل تريد تصفير العداد؟")) {
            document.getElementById("count-num").innerText = "0";
        }
    }

    function shareApp() {
        const msg = `🌙 ورد 1 رمضان - صدقة جارية عن روح المرحومة شمسية أم شكري. تابع معي الورد والسبحة من هنا:\n${window.location.href}`;
        window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg));
    }
</script>

</body>
</html>
