<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وردي - المصحف والأذكار</title>
    <style>
        :root { --primary: #2ecc71; --bg: #0f2027; --glass: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; margin: 0; padding: 10px; min-height: 100vh; }
        
        .container { max-width: 800px; margin: auto; animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 15px; }
        
        h1 { font-size: 1.8rem; color: var(--primary); margin: 0 0 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .wird-badge { background: var(--primary); color: #000; padding: 5px 15px; border-radius: 50px; font-weight: bold; display: inline-block; margin-bottom: 10px; }

        .stats-row { display: flex; justify-content: space-around; margin: 15px 0; font-size: 0.9rem; }
        .stat-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; flex: 1; margin: 0 5px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.9rem; }
        .btn-azkar { background: #3498db; color: white; }
        .btn-share { background: #25D366; color: white; }
        button:hover { opacity: 0.8; transform: scale(0.98); }

        .quran-frame-wrapper { position: relative; width: 100%; height: 75vh; border-radius: 15px; overflow: hidden; border: 3px solid var(--primary); background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }

        #azkar-content { display: none; text-align: right; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .visitor-img { filter: drop-shadow(0 0 5px var(--primary)); margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>✨ وردي اليومي</h1>
        <div id="wird-info" class="wird-badge">جاري الحساب...</div>
        
        <div class="stats-row">
            <div class="stat-item">ختماتي: <span id="khitma-count">0</span></div>
            <div class="stat-item">
                زوارنا: <br>
                <img class="visitor-img" src="https://hitwebcounter.com/counter/counter.php?page=wirdquran_jawad&style=0006&nbdigits=5&type=page&initCount=0" border="0">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-azkar" onclick="toggleAzkar()">📿 الأذكار</button>
            <button class="btn-share" onclick="shareWird()">🔗 انشر الخير</button>
        </div>

        <div id="azkar-content">
            <strong>أذكار اليوم:</strong><hr>
            <p>• آية الكرسي: (حفظ من الشيطان)</p>
            <p>• الإخلاص والمعوذتين: (تكفيك من كل شيء)</p>
            <p>• رضيت بالله ربا، وبالإسلام دينا، وبمحمد ﷺ نبيا.</p>
        </div>
    </div>

    <div class="quran-frame-wrapper">
        <iframe id="quran-iframe" src=""></iframe>
    </div>
</div>

<script>
    // برمجة التاريخ والأجزاء
    const startDate = new Date(2026, 1, 19); 
    const today = new Date();
    const diffDays = Math.floor(Math.abs(today - startDate) / (1000 * 60 * 60 * 24));
    const juz = (diffDays % 30) + 1;

    document.getElementById("wird-info").innerText = "الجزء الحالي: " + juz;
    document.getElementById("quran-iframe").src = `https://quran.com/juz/${juz}?view=reading`;

    // نظام الختمات الشخصي (يحفظ في التليفون)
    let khitmas = localStorage.getItem('myKhitmas') || 0;
    document.getElementById("khitma-count").innerText = khitmas;

    function toggleAzkar() {
        const content = document.getElementById("azkar-content");
        content.style.display = (content.style.display === "block") ? "none" : "block";
    }

    function shareWird() {
        const msg = `أدعوكم لمشاركتي ورد القرآن اليومي عبر هذا الرابط الاحترافي:\n${window.location.href}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }
</script>

</body>
</html>
