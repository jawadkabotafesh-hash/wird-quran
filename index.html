<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورد القرآن والأذكار</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #0f2027; color: white; padding: 10px; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #2ecc71; font-size: 1.5rem; margin-bottom: 5px; }
        .wird-text { font-weight: bold; color: #f1c40f; font-size: 1.2rem; margin: 5px 0; }
        
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-azkar { background: #3498db; color: white; }
        .btn-share { background: #25D366; color: white; }
        
        .quran-container { width: 100%; height: 70vh; border-radius: 10px; overflow: hidden; border: 2px solid #2ecc71; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .visitor-counter { font-size: 0.8rem; color: #bdc3c7; margin-top: 10px; }
        #azkar-section { display: none; background: #1e3c72; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: right; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="card">
        <h1>📖 ورد القرآن اليومي</h1>
        <div id="wird-info" class="wird-text">جاري تحضير الورد...</div>
        
        <div class="btn-group">
            <button class="btn-azkar" onclick="toggleAzkar()">☀️ أذكار الصباح والمساء</button>
            <button class="btn-share" onclick="shareWhatsapp()">📢 شارك الأجر</button>
        </div>

        <div id="azkar-section">
            <h3>☀️ أذكار الصباح والمساء</h3>
            <p>• آية الكرسي: اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...</p>
            <p>• الإخلاص والمعوذتين (3 مرات)</p>
            <p>• أصبحنا وأصبح الملك لله والحمد لله...</p>
            <p>• باسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء...</p>
            <button onclick="toggleAzkar()" style="background:red; color:white; padding:5px 10px;">إغلاق</button>
        </div>

        <div class="visitor-counter">
            عدد الذين قرأوا معنا اليوم: 
            <img src="https://hitwebcounter.com/counter/counter.php?page=wirdquran_jawad&style=0006&nbdigits=5&type=page&initCount=0" border="0" style="vertical-align: middle;">
        </div>
    </div>

    <div class="quran-container">
        <iframe id="quran-frame" src=""></iframe>
    </div>

    <script>
        // حساب الورد: اليوم الأول هو 19 فبراير
        const startDate = new Date(2026, 1, 19); 
        const today = new Date();
        const diffTime = Math.abs(today - startDate);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const juzNumber = (diffDays % 30) + 1;

        document.getElementById("wird-info").innerText = "وردك اليوم هو الجزء رقم " + juzNumber;
        document.getElementById("quran-frame").src = "https://quran.com/juz/" + juzNumber;

        function toggleAzkar() {
            var section = document.getElementById("azkar-section");
            section.style.display = (section.style.display === "block") ? "none" : "block";
            if(section.style.display === "block") section.scrollIntoView({behavior: "smooth"});
        }

        function shareWhatsapp() {
            const text = "الحمد لله بدأت بمتابعة وردي اليومي من خلال هذا الموقع الرائع، شاركني الأجر وابدأ وردك اليوم: " + window.location.href;
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text));
        }
    </script>

</body>
</html>
