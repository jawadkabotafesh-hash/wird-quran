<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردي - 1 رمضان</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2800/2800115.png">
    <style>
        :root { --primary: #2ecc71; --accent: #f1c40f; --bg: #0f2027; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f2027; color: white; margin: 0; padding: 10px; overflow-x: hidden; }
        
        /* بطاقة التهنئة برمضان */
        .ramadan-header { background: linear-gradient(45deg, #1e3c72, #2a5298); color: #fff; padding: 15px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; border: 1px solid var(--accent); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        h1 { font-size: 1.2rem; color: var(--primary); margin: 5px 0; }
        .juz-badge { color: var(--accent); font-weight: bold; font-size: 1.1rem; margin: 5px 0; display: block; }
        
        .audio-player { width: 100%; margin: 10px 0; height: 35px; border-radius: 10px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-sebha { background: var(--accent); color: #000; }
        .btn-share { background: #25D366; color: white; }

        .quran-view { width: 100%; height: 75vh; border-radius: 15px; border: 1px solid var(--primary); background: white; }
        
        #sebha-display { display: none; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
    </style>
</head>
<body>

<div class="ramadan-header">
    🌙 مبارك عليكم الشهر <br>
    <span style="font-size: 0.8rem; font-weight: normal;">تقبل الله منا ومنكم صالح الأعمال</span>
</div>

<div class="glass-card">
    <h1>✨ ورد اليوم الأول</h1>
    <span id="juz-name" class="juz-badge">الجزء رقم 1</span>
    
    <audio id="audio-player" class="audio-player" controls>
        <source id="audio-source" src="https://download.quranicaudio.com/quran/muhammad_siddeeq_al-minshaawee/juz01.mp3" type="audio/mpeg">
    </audio>

    <div class="btn-grid">
        <button class="btn-sebha" onclick="toggleSebha()">📿 السبحة الإلكترونية</button>
        <button class="btn-share" onclick="shareApp()">📢 انشر الأجر</button>
    </div>

    <div id="sebha-display">
        <div style="font-size: 1.5rem; color: var(--accent);" id="count-num">0</div>
        <button onclick="addCount()" style="width:100%; background:var(--primary); color:white; margin-top:5px;">سبّح</button>
    </div>
</div>

<iframe id="quran-frame" class="quran-view" src="https://quran.com/juz/1?view=reading"></iframe>

<script>
    // تعديل التاريخ ليكون اليوم هو 1 رمضان (الجزء 1)
    const juz = 1; 

    function toggleSebha() {
        const d = document.getElementById("sebha-display");
        d.style.display = (d.style.display === "block") ? "none" : "block";
    }
    function addCount() {
        let sCount = parseInt(document.getElementById("count-num").innerText);
        sCount++;
        document.getElementById("count-num").innerText = sCount;
    }

    function shareApp() {
        const msg = `🌙 بدأنا اليوم وردنا لـ 1 رمضان! تابع معي الورد اليومي (مصحف وصوت وسبحة) من هنا:\n${window.location.href}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }
</script>

</body>
</html>
