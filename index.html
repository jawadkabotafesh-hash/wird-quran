<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورد القرآن اليومي</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
  color: white;
  padding: 50px;
}
.card {
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 15px;
  display: inline-block;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
.done {
  background-color: #4CAF50;
  color: white;
}
</style>
</head>
<body>

<h1>📖 ورد القرآن اليومي</h1>

<div class="card">
  <h2 id="date"></h2>
  <h3 id="wird"></h3>
  <button class="done" onclick="markDone()">تم الإنجاز ✅</button>
  <p id="status"></p>
</div>

<script>
const today = new Date();
const day = today.getDate();
const juz = ((day - 1) % 30) + 1;

document.getElementById("date").innerText =
"تاريخ اليوم: " + today.toLocaleDateString('ar-EG');

document.getElementById("wird").innerText =
"وردك اليوم: الجزء رقم " + juz;

function markDone() {
  document.getElementById("status").innerText =
  "ما شاء الله! الله يتقبل منك 🤍";
}
</script>

</body>
</html>
