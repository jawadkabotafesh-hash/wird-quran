<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورد القرآن اليومي</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #0f2027; color: white; padding: 10px; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); margin-bottom: 10px; }
        h1 { color: #2ecc71; font-size: 1.5rem; }
        .quran-container { width: 100%; height: 85vh; border-radius: 10px; overflow: hidden; border: 2px solid #2ecc71; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📖 ورد القرآن اليومي</h1>
        <p id="wird-info" style="font-weight: bold; color: #f1c40f; margin: 5px 0;"></p>
    </div>
    <div class="quran-container">
        <iframe id="quran-frame" src=""></iframe>
    </div>
    <script>
        const today = new Date();
        const start = new Date(today.getFullYear(), 0, 0);
        const diff = today - start;
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        const juzNumber = (dayOfYear % 30) + 1;
        document.getElementById("wird-info").innerText = "وردك اليوم هو الجزء رقم: " + juzNumber;
        document.getElementById("quran-frame").src = "https://quran.com/juz/" + juzNumber;
    </script>
</body>
</html>
