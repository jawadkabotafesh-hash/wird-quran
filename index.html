<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردي - صدقة جارية</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2800/2800115.png">
    <style>
        :root { --primary: #2ecc71; --accent: #f1c40f; --bg: #0f2027; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f2027; color: white; margin: 0; padding: 5px; text-align: center; }
        
        .charity-header { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 15px; font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; }
        
        h1 { font-size: 1.1rem; color: var(--primary); margin: 5px 0; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 10px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-sebha { background: var(--accent); color: #000; }
        .btn-share { background: #25D366; color: white; }

        /* حاوية المصحف السلسة */
        .quran-wrapper { width: 100%; height: 80vh; border-radius: 15px; overflow: hidden; border: 1px solid var(--primary); background: white; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        #sebha-display { display: none; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 15px; margin-top: 10px; border: 1px solid var(--accent); }
        #count-num { font-size: 2.2rem; color: var(--accent); display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="charity-header">
    🤍 صدقة جارية عن روح المرحومة (شمسية أم شكري)
</div>

<div class="glass-card">
    <h1>✨ ورد 1 رمضان</h1>
    <div class="btn-grid">
        <button class="btn-sebha" onclick="toggleSebha()">📿 السبحة</button>
        <button class="btn-share" onclick="shareApp()">📢 مشاركة</button>
    </div>

    <div id="sebha-display">
        <span id="count-num">0</span>
        <button onclick="addCount()" style="width:100%; background:var(--primary); color:white; height:50px; border-radius:10px;">سبّح</button>
    </div>
</div>

<div class="quran-wrapper">
    <iframe src="https://quran.com/juz/1?view=reading" allowfullscreen></iframe>
</div>

<script>
    function toggleSebha() {
        const d = document.getElementById("sebha-display");
        d.style.display = (d.style.display === "block") ? "none" : "block";
    }
    function addCount() {
        let n = document.getElementById("count-num");
        n.innerText = parseInt(n.innerText) + 1;
    }
    function shareApp() {
        const msg = `🌙 ورد 1 رمضان - صدقة جارية عن روح المرحومة شمسية أم شكري:\n${window.location.href}`;
        window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg));
    }
</script>

</body>
</html>
